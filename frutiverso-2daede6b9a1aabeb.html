<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Freshflow · Frutiverso Getafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --green:#306A57; --green-d:#2B3A36; --ink:#18181B; --mute:#71717A; --line:#E7E6E6;
  --amber:#FAAF3B; --amber-bg:#FFF7EB; --red:#E65050; --red-bg:#FDEEEE;
  --blue-bg:#C7E8ED; --ok:#6EA050; --ok-bg:#EDF3EC; --lime:#C1CE5D;
}
html,body{margin:0;height:100%;background:#111;color:var(--ink);
  font-family:'Inter','Noto Sans Arabic',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[lang=ar] body{font-family:'Noto Sans Arabic','Inter',-apple-system,sans-serif}
button{font-family:inherit}
.num{unicode-bidi:isolate;direction:ltr;display:inline-block}

/* both screens share one frame */
.frame{width:min(100%,1180px);height:100%;margin:0 auto;background:#F4F5F4;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:1400px){ body{display:flex;align-items:center} .frame{height:min(100vh,1000px);border-radius:12px} }
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

/* ---------- header (shared) ---------- */
.hdr{background:var(--green);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex:0 0 auto}
.hdr .sp{flex:1}
.store{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:99px;padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.profile{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:0 0 auto}
.back{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;cursor:pointer;background:none;border:0;color:#fff;padding:4px 0}
html[dir=rtl] .back .chev{transform:scaleX(-1)}
.hdr .mid{flex:1;min-width:0}
.hdr .t1{font-weight:700;font-size:15.5px}
.hdr .t1 .dim{opacity:.75;font-weight:600}
.hdr .t2{font-size:12.5px;color:#cfe0d7;margin-top:2px}
.hdr .t2 b{color:#F5B453}

/* language switch: always three choices, same control on both screens */
.langsw{display:inline-flex;background:rgba(255,255,255,.14);border-radius:99px;padding:3px;gap:2px;flex:0 0 auto}
.langsw button{border:0;background:none;color:#fff;font-weight:700;font-size:12.5px;padding:6px 11px;border-radius:99px;cursor:pointer;opacity:.8;white-space:nowrap}
.langsw button.on{background:#fff;color:var(--green);opacity:1}

/* ---------- dashboard ---------- */
.dbody{flex:1;overflow-y:auto;padding:24px 26px 30px}
.sec{font-size:13.5px;font-weight:600;margin:0 0 10px}
.sec .dt{color:var(--mute);font-weight:500}
.row1{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-bottom:24px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.08);padding:18px 20px}
.ordcard{background:var(--amber-bg);border:1px solid #F5DFB3;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;
  min-height:150px;cursor:pointer;transition:box-shadow .15s}
.ordcard:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.ordcard.sent{background:var(--ok-bg);border-color:#cfe0d7}
.ordcard .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ordcard .nm{font-weight:800;font-size:17px}
.ordcard .dl{font-size:13px;color:#6b5a33;margin-top:4px}
.ordcard .cnt{font-size:15px;color:#4a4a4a;margin-top:10px}
.ordcard .go{margin-top:auto;align-self:flex-end;font-weight:700;font-size:13.5px;color:var(--green)}
.pillopen{background:var(--amber);color:#fff;font-weight:700;font-size:11.5px;border-radius:99px;padding:4px 12px;text-transform:uppercase}
.ordcard.sent .pillopen{background:var(--green)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpi .lb{font-size:13px;font-weight:600}
.kpi .val{font-size:24px;font-weight:800;margin-top:8px}
.kpi .chg{font-weight:700;font-size:14px;color:var(--green);margin-top:6px}
.kpi .rng{font-size:11.5px;color:var(--mute);margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:24px}
.mini .lb{font-size:13.5px;font-weight:600;margin-bottom:12px}
.wx{display:flex;align-items:center;gap:16px}
.wx .city{font-weight:700;font-size:14px}
.wx .addr{font-size:12px;color:var(--mute);margin-top:2px}
.wx .temp{font-size:30px;font-weight:800;margin-top:6px}
.wx .sun{margin-inline-start:auto}
.sunpill{background:#FFF1C9;color:#7a5a00;font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;display:inline-block;margin-top:8px}
.ev{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .nm{font-weight:700;font-size:13.5px}
.ev .dt{font-size:12.5px;color:var(--mute);white-space:nowrap}
.chart .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.chart .hd .nm{font-weight:700;font-size:14.5px}
.chart .hd .val{font-weight:800;font-size:16px}
.chart .hd .chg{font-weight:700;font-size:13.5px;color:var(--green)}
.chart .hd .rng{margin-inline-start:auto;font-size:11.5px;color:var(--mute)}
.chart svg{width:100%;height:auto;display:block}
.nav{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 12px;position:relative}
.navit{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mute);background:none;border:0;cursor:pointer}
.navit.on{color:var(--amber)}
.fab{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;border:0;
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.35);cursor:pointer}

/* ---------- order screen ---------- */
#order{background:#fff}
.srch{display:flex;align-items:center;gap:10px;padding:11px 20px;border-bottom:1px solid var(--line)}
.srch input{border:0;outline:0;font-size:16px;flex:1;color:var(--ink);background:none;font-family:inherit}
.cats{display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1.5px solid #e4e9e6;background:#fff;border-radius:99px;padding:4px 12px 4px 4px;
  font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap}
html[dir=rtl] .cat{padding:4px 4px 4px 12px}
.cat img{width:26px;height:26px;border-radius:99px;object-fit:cover;background:#eee}
.cat .n{font-weight:500;color:var(--mute)}
.cat.all{padding:6px 14px}
.cat.on{background:var(--green);border-color:var(--green);color:#fff}
.cat.on .n{color:#cfe0d7}
.colh,.row{display:grid;grid-template-columns:1fr 170px 250px;gap:14px;padding:10px 20px;align-items:center}
.colh{border-bottom:2px solid #333;font-weight:700;font-size:13.5px}
.colh .e{text-align:end}
.list{flex:1;min-height:0;overflow-y:auto}
.row{border-bottom:1px solid #f2f2f2;padding:11px 20px}
.row.chg{background:#FFFCF5}
.grp{padding:14px 20px 6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:#FAFBFA;border-bottom:1px solid #f2f2f2;display:flex;align-items:center;gap:8px}
html[lang=ar] .grp{letter-spacing:0}
.grp img{width:20px;height:20px;border-radius:5px;object-fit:cover}
.nm{font-weight:800;font-size:14.5px;line-height:1.25}
.meta{color:#9a9a9a;font-size:11.5px;margin-top:4px}
.pills{display:inline-flex;gap:5px;margin-inline-start:6px;vertical-align:2px}
.pill{border:1px solid #e0e0e0;border-radius:99px;padding:1px 8px;font-size:10.5px;color:#5d6b64;background:#fff;font-weight:600}
.pill.b{border-color:#cfe0d7;background:#F1F7F3;color:var(--green)}
.pill.promo{border-color:#e6b5a6;background:var(--red-bg);color:#8d2b0c;font-weight:700}
/* order stepper: grey pill, bold -/+ either side, white value box in the middle */
.step{display:flex;justify-content:flex-end}
.step .pillstep{display:inline-flex;align-items:center;gap:2px;background:#F1F2F1;border-radius:18px;padding:5px}
.step button{width:44px;height:50px;border:0;background:none;color:#2b3a36;cursor:pointer;display:grid;place-items:center;border-radius:12px;padding:0}
.step button:hover:not(:disabled){background:#e6e8e6}
.step button:disabled{color:#c9cdca;cursor:default}
.qbox{min-width:118px;height:54px;padding:0 12px;background:#fff;border:1px solid #e3e3e3;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;cursor:pointer;white-space:nowrap}
.qbox .big{font-size:19px;font-weight:800;line-height:1.1}
.qbox .big small{font-size:14px;font-weight:500;color:#3a3a3a;margin-inline-start:3px}
.qbox .sub{font-size:13px;font-weight:500;color:var(--mute)}
.qbox.chg{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
/* inventory: the value box alone, a tap opens the keypad */
.invbox{display:inline-flex}
.invbox .qbox:hover{border-color:#c9cdca}
.ref{margin-top:6px;text-align:end;font-size:11.5px;color:#a0a0a0}
.ref b{color:#6d6d6d}
.ref a{color:var(--green);font-weight:700;cursor:pointer;text-decoration:none;margin-inline-start:6px}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.foot{display:flex;align-items:center;gap:26px;padding:14px 20px;border-top:1px solid var(--line);background:#fff;flex:0 0 auto}
.foot .m{font-size:12px;color:var(--mute)}
.foot .m b{display:block;font-size:16px;color:var(--ink);margin-top:2px}
.foot .sp{flex:1}
.cta{background:var(--green);color:#fff;border:0;border-radius:99px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{background:var(--green-d)}
.cta.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}

/* ---------- sheets ---------- */
.ov{position:fixed;inset:0;background:rgba(20,25,22,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:16px 16px 0 0;padding-bottom:18px;max-height:96vh;overflow-y:auto}
.sheet.center{align-self:center;border-radius:16px}
.sh{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.sh h3{margin:0;font-size:17px;flex:1}
.sh .x{border:0;background:none;font-size:22px;color:#777;cursor:pointer}
.kbody{display:grid;grid-template-columns:1fr 260px;gap:22px;padding:18px 22px}
.kval{border:1.5px solid var(--amber);border-radius:10px;padding:12px 16px;font-size:26px;font-weight:800;text-align:center;margin:14px 0 6px}
.kunit{text-align:center;font-size:12.5px;color:var(--mute)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.pad button{background:#F1F6F2;border:0;border-radius:9px;padding:15px 0;font-size:17px;font-weight:700;cursor:pointer;color:#1f3a2d}
.pad button:hover{background:#E4EFE7}
.sfoot{display:flex;align-items:center;padding:0 22px;gap:12px}
.sfoot .lnk{color:var(--green);font-weight:700;cursor:pointer}
.sfoot .sp{flex:1}
.sum{padding:18px 22px;font-size:14px;line-height:1.9;color:#3d4a44}
.sum b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;
  font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}

/* ---------- phone width ---------- */
@media(max-width:760px){
  .hdr{padding:12px 16px;flex-wrap:wrap}
  .store{display:none}
  .dbody{padding:18px 16px 24px}
  .row1,.row2{grid-template-columns:1fr}
  .hdr .t1 .dim{display:none}
  .hdr .t1{font-size:14.5px}
  .hdr .t2{font-size:11.5px}
  .colh{grid-template-columns:1fr 1fr;padding:8px 16px;font-size:12.5px}
  .colh>div:first-child{display:none}
  .row{grid-template-columns:1fr 1fr;padding:12px 16px}
  .row .itemcell{grid-column:1/-1}
  .qbox{min-width:92px}
  .step button{width:38px}
  .foot{gap:14px;flex-wrap:wrap;padding:12px 16px}
  .foot .m.opt{display:none}
  .foot .sp{display:none}
  .foot .cta{flex:1}
  .kbody{grid-template-columns:1fr}
  .srch,.cats{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="frame">

<!-- ================= DASHBOARD ================= -->
<section class="screen on" id="dash">
  <div class="hdr">
    <svg width="26" height="26" viewBox="0 0 49 48" fill="none" aria-label="Freshflow">
      <path d="M31.3359 4.50001C31.3359 7.51949 28.9476 9.9375 25.8984 9.9375H23.2734C17.7898 9.9375 13.3359 14.2573 13.3359 19.6875V28.6071L13.3359 43.5H17.8359V28.6071V20.8149V19.6875C17.8359 16.668 20.2243 14.25 23.2734 14.25H25.8984C27.9394 14.25 29.7376 13.7971 31.3359 12.75C34.0501 10.9675 35.8359 7.88474 35.8359 4.5L31.3359 4.50001Z" fill="#fff"/>
      <path d="M17.8359 43.5V38.0625C17.8359 35.4496 20.0277 33.375 22.7109 33.375H26.4609C31.5567 33.375 35.8359 29.1956 35.8359 24.1875V14.0625C35.8359 17.5312 34.3359 20.625 31.3359 22.4062V24.1875C31.3359 26.8004 29.1442 29.0625 26.4609 29.0625H22.7109C20.9385 29.0625 19.2637 29.4282 17.8359 30.2991C15.2019 31.8959 13.3359 34.7964 13.3359 38.0625V43.5H17.8359Z" fill="#fff"/>
      <path d="M31.3359 12.6543V14.6686C31.3359 17.2897 29.1413 19.5 26.4609 19.5H22.7109C20.9404 19.5 19.2622 19.935 17.8359 20.8087V28.5747C17.8359 25.9537 20.0306 23.8125 22.7109 23.8125H26.4609C31.5511 23.8125 35.8359 19.6923 35.8359 14.6686V4.5C35.8359 7.92191 33.9797 10.7812 31.3359 12.6543Z" fill="#fff"/>
    </svg>
    <div class="sp"></div>
    <div class="store">Frutiverso Getafe</div>
    <div class="langsw" data-langsw></div>
    <div class="profile"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></div>
  </div>

  <div class="dbody">
    <div class="row1">
      <div>
        <div class="sec" data-t="nextOrder"></div>
        <div class="ordcard" id="ordCard">
          <div class="top"><div class="nm">Frutiverso</div><span class="pillopen" id="ordPill"></span></div>
          <div class="dl" id="ordDl"></div>
          <div class="cnt" id="ordLeft"></div>
          <div class="go" id="ordGo"></div>
        </div>
      </div>
      <div>
        <div class="sec"><span data-t="overview"></span> <span class="dt" id="todayLbl"></span></div>
        <div class="kpis">
          <div class="card kpi"><div class="lb" data-t="revenue"></div><div class="val" id="kRev"></div><div class="chg">▲ <span class="num" id="kRevC"></span></div><div class="rng" id="kRng1"></div></div>
          <div class="card kpi"><div class="lb" data-t="waste"></div><div class="val" id="kWaste"></div><div class="chg">▼ <span class="num" id="kWasteC"></span></div><div class="rng" id="kRng2"></div></div>
        </div>
      </div>
    </div>

    <div class="row2">
      <div class="card mini">
        <div class="lb" data-t="weather"></div>
        <div class="wx">
          <div>
            <div class="city">Getafe, Madrid</div>
            <div class="addr">Calle Madrid, 115</div>
            <div class="temp"><span class="num">20°C</span></div>
            <span class="sunpill" data-t="sunny"></span>
          </div>
          <svg class="sun" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#F2A900" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="#FFD54A"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.6" y1="4.6" x2="6.4" y2="6.4"/><line x1="17.6" y1="17.6" x2="19.4" y2="19.4"/><line x1="4.6" y1="19.4" x2="6.4" y2="17.6"/><line x1="17.6" y1="6.4" x2="19.4" y2="4.6"/></svg>
        </div>
      </div>
      <div class="card mini">
        <div class="lb" data-t="events"></div>
        <div id="events"></div>
      </div>
    </div>

    <div class="card chart">
      <div class="hd">
        <span class="nm" data-t="revenue"></span>
        <span class="val" id="cRev"></span>
        <span class="chg">▲ <span class="num" id="cRevC"></span></span>
        <span class="rng" id="cRng"></span>
      </div>
      <svg id="revChart" viewBox="0 0 860 190" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div class="nav">
    <button class="fab" id="fab" type="button" data-tt="openOrder">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    </button>
    <button class="navit on" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span data-t="navDash"></span></button>
    <button class="navit" type="button" id="navOrders"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg><span data-t="navOrders"></span></button>
    <button class="navit" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 20v-6h6v6"/></svg><span data-t="navStore"></span></button>
    <button class="navit" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span data-t="navSettings"></span></button>
  </div>
</section>

<!-- ================= ORDER ================= -->
<section class="screen" id="order">
  <div class="hdr">
    <button class="back" id="backBtn" type="button"><span class="chev">‹</span> <span data-t="back"></span></button>
    <div class="mid">
      <div class="t1"><span data-t="order"></span> &nbsp;<span id="hdrDate"></span> &nbsp;<span class="dim">| &nbsp;Frutiverso Getafe</span></div>
      <div class="t2" id="hdrDeadline"></div>
    </div>
    <div class="langsw" data-langsw></div>
  </div>

  <div class="srch">
    <span style="color:#9a9a9a">⌕</span>
    <input id="q" type="search" autocomplete="off">
  </div>

}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-langsw] button'); if(b) setLang(b.dataset.l);
});

/* ---------- dashboard ---------- */
const REV = [2840,3010,3120,3390,3980,4620,1980, 2900,2950,3180,3420,4050,4710,2010, 2870,3060,3210,3460,4110,4790,2050, 2960,3090,3300,3510,4180,4890];
const REV_LY = REV.map((v,i)=>Math.round(v*(0.95+0.02*Math.sin(i))));
function remaining(){
  const ms = DEADLINE_UTC - Date.now();
  if(ms<=0) return null;
  const m = Math.floor(ms/60000);
  return {h:Math.floor(m/60), m:m%60};
}
function renderDash(){
  const rem = remaining();
  const card = document.getElementById('ordCard');
  card.classList.toggle('sent', SENT);
  document.getElementById('ordPill').textContent = SENT ? T('sentPill') : T('open');
  document.getElementById('ordDl').innerHTML = T('deadline',{d:dShort(ORDER_DATE)}) + ' · ' + T('delivery',{d:dShort(DELIVERY_DATE)});
  document.getElementById('ordLeft').textContent = SENT ? T('sent',{n:nf(totals().cases)}) : (rem ? T('left',{h:nf(rem.h),m:nf(rem.m)}) : T('closed'));
  document.getElementById('ordGo').textContent = SENT ? T('viewOrder') : T('goOrder');
  document.getElementById('todayLbl').textContent = dfmt(new Date().toISOString().slice(0,10),{day:'numeric',month:'short',year:'numeric'});
  const rev = REV.reduce((a,b)=>a+b,0);
  const rng = dfmt('2026-09-11',{day:'numeric',month:'short'})+' – '+dfmt('2026-10-08',{day:'numeric',month:'short'});
  document.getElementById('kRev').textContent = eur(rev,0);
  document.getElementById('kRevC').textContent = '+'+nf(4.1,1)+' %';
  document.getElementById('kWaste').textContent = eur(1240,0);
  document.getElementById('kWasteC').textContent = '−'+nf(18.6,1)+' %';
  document.getElementById('kRng1').textContent = rng;
  document.getElementById('kRng2').textContent = rng;
  document.getElementById('cRev').textContent = eur(rev,0);
  document.getElementById('cRevC').textContent = '+'+nf(4.1,1)+' %';
  document.getElementById('cRng').textContent = T('last4w')+' · '+rng;
  document.getElementById('events').innerHTML = [['ev1','2026-10-12'],['ev2','2026-11-01'],['ev3','2026-12-06']]
    .map(([k,d])=>`<div class="ev"><div class="nm">${T(k)}</div><div class="dt">${dfmt(d,{weekday:'short',day:'numeric',month:'short'})}</div></div>`).join('');
  drawChart();
}
function drawChart(){
  const W=860, H=160, max=5200, n=REV.length;
  const x=i=>Math.round(i*(W-60)/(n-1))+50, y=v=>Math.round(H-v/max*(H-12));
  const pts=a=>a.map((v,i)=>x(i)+','+y(v)).join(' ');
  let s='';
  [1000,2500,4000].forEach(v=>{ s+=`<line x1="50" y1="${y(v)}" x2="${W}" y2="${y(v)}" stroke="#ececec"/><text x="0" y="${y(v)+4}" font-size="11" fill="#9a9a9a">${eur(v,0)}</text>`; });
  s+=`<polygon fill="#DDE8FB" opacity=".55" points="${pts(REV)} ${x(n-1)},${H} ${x(0)},${H}"/>`;
  s+=`<polyline fill="none" stroke="#9CB7DE" stroke-width="2" stroke-dasharray="4 4" points="${pts(REV_LY)}"/>`;
  s+=`<polyline fill="none" stroke="#3D7EEA" stroke-width="2.4" points="${pts(REV)}"/>`;
  for(let i=0;i<n;i+=7){
    const d=new Date(Date.UTC(2026,8,11+i,12));
    s+=`<text x="${x(i)}" y="${H+22}" font-size="11" fill="#9a9a9a" text-anchor="middle">${new Intl.DateTimeFormat(LOCALE[LANG],{day:'numeric',month:'short',timeZone:TZ}).format(d)}</text>`;
  }
  const svg=document.getElementById('revChart');
  svg.setAttribute('direction','ltr');
  svg.innerHTML=s;
}
setInterval(()=>{ if(document.getElementById('dash').classList.contains('on')) renderDash(); }, 30000);

/* ---------- navigation ---------- */
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); }
function openOrder(){ show('order'); renderOrder(); }
document.getElementById('fab').onclick = openOrder;
document.getElementById('ordCard').onclick = openOrder;
document.getElementById('navOrders').onclick = openOrder;
document.getElementById('backBtn').onclick = ()=>{ show('dash'); renderDash(); };

/* ---------- order list ---------- */
const unitOf = it=>it.u==='kg' ? T('kg') : T('pcs');
const itemName = it=>it.n[LANG];   // the list shows the selected language only
function renderCats(){
  const cnt = id=>ITEMS.filter(it=>it.c===id).length;
  let h = `<button class="cat all${CAT===null?' on':''}" data-cat="" type="button">${T('all')} <span class="n num">${ITEMS.length}</span></button>`;
  CATS.forEach(([id,img,lb])=>{
    h += `<button class="cat${CAT===id?' on':''}" data-cat="${id}" type="button"><img src="assets/categories/${img}" alt="" onerror="this.style.display='none'">${lb[LANG]} <span class="n num">${cnt(id)}</span></button>`;
  });
  document.getElementById('cats').innerHTML = h;
}
document.getElementById('cats').addEventListener('click', e=>{
  const b=e.target.closest('[data-cat]'); if(!b) return;
  CAT = b.dataset.cat || null;
  renderOrder();
  document.getElementById('list').scrollTop = 0;
});
function renderOrder(){
  document.getElementById('hdrDate').textContent = dShort(ORDER_DATE);
  document.getElementById('hdrDeadline').innerHTML = `<b>${T('deadline',{d:dShort(ORDER_DATE)})}</b> · ${T('delivery',{d:dShort(DELIVERY_DATE)})}`;
  renderCats();
  const q = (document.getElementById('q').value||'').toLowerCase().trim();
  let html='';
  CATS.forEach(([cid,img,lb])=>{
    if(CAT && CAT!==cid) return;
    const rows = ITEMS.map((it,i)=>i).filter(i=>{
      const it=ITEMS[i];
      if(it.c!==cid) return false;
      if(!q) return true;
      return it.plu.includes(q) || ['es','ar','en'].some(l=>it.n[l].toLowerCase().includes(q));
    });
    if(!rows.length) return;
    html += `<div class="grp"><img src="assets/categories/${img}" alt="" onerror="this.style.display='none'">${lb[LANG]}</div>`;
    rows.forEach(i=>{
      const it=ITEMS[i], s=ST[i];
      const sug = suggest(it, s.inv), o = ordOf(i), chg = s.ord!=null && s.ord!==sug;
      let pills='';
      if(it.bio) pills+=`<span class="pill b">${T('organic')}</span>`;
      if(it.promo) pills+=`<span class="pill promo">${T('promo')}</span>`;
      const meta = `<span class="num">${it.plu}</span> · ${T('perCase')} ${csf(it.cs)} ${unitOf(it)} · <span class="num">${eur(it.vk)}</span>/${unitOf(it)}`;
      html += `<div class="row${chg?' chg':''}">
        <div class="itemcell"><div class="nm">${itemName(it)}${pills?`<span class="pills">${pills}</span>`:''}</div>
          <div class="meta">${meta}</div></div>
        <div><div class="invbox"><div class="qbox${s.invChg?' chg':''}" data-a="invpad" data-i="${i}"><span class="big">${csf(s.inv)}<small>${T('caseU')}</small></span><span class="sub">${csf(Math.round(s.inv*it.cs*10)/10)} ${unitOf(it)}</span></div></div></div>
        <div><div class="step"><div class="pillstep">
          <button data-a="ord" data-d="-1" data-i="${i}" type="button" aria-label="−"${o<=0?' disabled':''}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
          <div class="qbox${chg?' chg':''}" data-a="ordpad" data-i="${i}"><span class="big">${nf(o)}<small>${T('caseU')}</small></span><span class="sub">${csf(o*it.cs)} ${unitOf(it)}</span></div>
          <button data-a="ord" data-d="1" data-i="${i}" type="button" aria-label="+"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><line x1="12" y1="5" x2="12" y2="19"/></svg></button></div></div>
          ${chg?`<div class="ref">${T('suggested')} <b>${nf(sug)} ${T('caseU')}</b><a data-a="undo" data-i="${i}">${T('reset')}</a></div>`:''}</div>
      </div>`;
    });
  });
  document.getElementById('list').innerHTML = html || `<div class="empty">${T('noHits')}</div>`;
  renderFoot();
}
function totals(){
  let cases=0, cost=0, sales=0, items=0, changed=0;
  ITEMS.forEach((it,i)=>{
    const o=ordOf(i);
    cases+=o; cost+=o*it.cs*it.ek; sales+=o*it.cs*it.vk;
    if(o>0) items++;
    if(ST[i].ord!=null && ST[i].ord!==suggest(it,ST[i].inv)) changed++;
  });
  return {cases,cost,sales,items,changed};
}
function renderFoot(){
  const t=totals();
  document.getElementById('fCases').textContent = nf(t.cases);
  document.getElementById('fCost').textContent = eur(t.cost);
  document.getElementById('fSales').textContent = eur(t.sales);
  document.getElementById('fMargin').textContent = nf(t.sales?(t.sales-t.cost)/t.sales*100:0,1)+' %';
}
document.getElementById('q').addEventListener('input', renderOrder);
document.getElementById('list').addEventListener('click', e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const i=+el.dataset.i, it=ITEMS[i], s=ST[i], d=+el.dataset.d;
  switch(el.dataset.a){
    case 'ord': s.ord=Math.max(0, ordOf(i)+d); if(s.ord===suggest(it,s.inv)) s.ord=null; break;
    case 'undo': s.ord=null; break;
    case 'invpad': return openPad(i,'inv');
    case 'ordpad': return openPad(i,'ord');
  }
  renderOrder();
});

/* ---------- keypad ---------- */
let PAD=null;
function openPad(i,kind){
  const it=ITEMS[i];
  PAD={i,kind,str:''};
  document.getElementById('padTitle').textContent = T(kind==='inv'?'padInv':'padOrd');
  document.getElementById('padName').textContent = itemName(it);
  document.getElementById('padDot').style.visibility = kind==='inv' ? 'visible' : 'hidden';
  drawPad();
  document.getElementById('ovPad').classList.add('on');
}
function padNum(){ return PAD.str==='' ? (PAD.kind==='inv'?ST[PAD.i].inv:ordOf(PAD.i)) : parseFloat(PAD.str)||0; }
function drawPad(){
  const it=ITEMS[PAD.i], v=padNum();
  document.getElementById('padVal').textContent = (PAD.str===''?csf(v):PAD.str.replace('.',(0.5).toLocaleString(LOCALE[LANG]).charAt(1)))+' '+T('caseU');
  document.getElementById('padUnit').textContent = T('inCases')+' · '+csf(Math.round(v*it.cs*10)/10)+' '+unitOf(it);
}
document.getElementById('pad').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b||!PAD) return;
  const k=b.dataset.k;
  if(k==='del') PAD.str=PAD.str.slice(0,-1);
  else if(k==='.'){ if(!PAD.str.includes('.')) PAD.str=(PAD.str||'0')+'.'; }
  else if(PAD.str.replace('.','').length<4) PAD.str = (PAD.str==='0'?'':PAD.str)+k;
  drawPad();
});
const closePad=()=>{ document.getElementById('ovPad').classList.remove('on'); PAD=null; };
document.getElementById('padX').onclick = closePad;
document.getElementById('padCancel').onclick = closePad;
document.getElementById('padSave').onclick = ()=>{
  const i=PAD.i, it=ITEMS[i], s=ST[i], v=padNum();
  if(PAD.kind==='inv'){ s.inv=Math.round(v*100)/100; s.invChg = s.inv!==it.inv; }
  else { s.ord=Math.round(v); if(s.ord===suggest(it,s.inv)) s.ord=null; }
  closePad(); renderOrder();
};

/* ---------- send ---------- */
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2600); }
document.getElementById('sendBtn').onclick = ()=>{
  const t=totals();
  document.getElementById('sendBody').innerHTML =
    `<div>${T('sumCases',{n:nf(t.cases),d:dShort(DELIVERY_DATE)})}</div>
     <div>${T('sumItems',{n:nf(t.items)})}</div>
     <div>${T('sumChanged',{n:nf(t.changed)})}</div>
     <div>${T('sumCost',{v:eur(t.cost)})}</div>`;
  document.getElementById('ovSend').classList.add('on');
};
const closeSend=()=>document.getElementById('ovSend').classList.remove('on');
document.getElementById('sendX').onclick = closeSend;
document.getElementById('sendCancel').onclick = closeSend;
document.getElementById('sendGo').onclick = ()=>{
  SENT=true; closeSend();
  toast(T('sent',{n:nf(totals().cases)}));
  show('dash'); renderDash();
};

setLang(LANG);
</script>
</body>
</html>
